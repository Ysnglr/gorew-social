const SR=[{ic:W(ICON.file),v:'KVKK',d:'uyumlu altyapı'},{ic:W(ICON.lock.replace(/width="28" height="28" /,'')),v:'256-bit',d:'şifreleme'},{ic:W(ICON.clock.replace(/width="26" height="26" /,'').replace('currentColor','#04110c')),v:'%99,9',d:'erişilebilirlik'}];
const rows=SR.map((a,i)=>{const d=el(`<div class="sr card a" style="top:${i*170}px"><div class="ic">${a.ic}</div><div class="v">${a.v}</div><div class="d">${a.d}</div></div>`);$('list').appendChild(d);return d;});
function render(t){glows(t);
  if(scene($('s0'),t,0,5.0,.01,.35)){fadeUp($('fri'),t,.1,.5,20);reveal($('h0'),t,.25);
    rows.forEach((d,i)=>{const t0=1.4+i*.45;const p=P(t,t0,t0+.4);T(d,{y:(1-eb(p))*40,s:L(.92,1,eb(p)),op:C(p*3)});});}
  if(scene($('s1'),t,4.9,9,.3,.01)){reveal($('h1'),t,5.0);const ip=P(t,5.7,6.2);T($('eIcon'),{s:pop(t,5.7,.5),r:(1-eo(ip))*-90,op:C(ip*3)});fadeUp($('s1s'),t,6.2,.5,20);fadeUp($('url'),t,6.6,.5,16);}
}
window.render=render;window.ready=ready();autoplay(9);
