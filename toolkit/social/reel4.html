    B.forEach((n,i)=>{const p=P(t,n.t,n.t+.4);const shake=t>6.2?Math.sin(t*40+i)*3*P(t,6.2,6.5):0;T(n.el,{x:shake,y:(1-eb(p))*50+Math.sin(t*1.5+i)*5,s:L(.85,1,eb(p)),r:n.r,op:C(p*3)});});}
